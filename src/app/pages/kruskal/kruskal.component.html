<div class="kruskal-container">
  <mat-sidenav-container class="sidenav-container">
    <!-- Left Sidebar (30%) -->
    <mat-sidenav mode="side" opened class="controls-sidenav">
      <mat-card class="controls-card" appearance="outlined">
        <mat-card-header>
          <mat-card-title>Algoritmo de Kruskal</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <!-- Vertex Input -->
          <div class="form-section">
            <mat-form-field appearance="outline">
              <mat-label>Número de vértices</mat-label>
              <input matInput type="number" [(ngModel)]="vertices" />
            </mat-form-field>
            <button mat-raised-button color="primary" (click)="onVertexCountChange()">
              <i class="bx bx-refresh"></i> Actualizar Nodos
            </button>
          </div>

          <!-- Edge Input -->
          <div class="form-section">
            <mat-form-field appearance="outline">
              <mat-label>Origen</mat-label>
              <input matInput type="number" [(ngModel)]="newSource" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Destino</mat-label>
              <input matInput type="number" [(ngModel)]="newDestination" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Peso</mat-label>
              <input matInput type="number" [(ngModel)]="newWeight" />
            </mat-form-field>
            <button mat-raised-button color="primary" (click)="addEdge()">
              <i class="bx bx-plus"></i> Agregar Arista
            </button>
          </div>

          <!-- Import/Export Buttons -->
          <div class="form-section">
            <button mat-raised-button color="primary" (click)="exportData()">
              <i class="bx bx-download"></i> Exportar JSON
            </button>
            <button mat-raised-button color="primary" (click)="triggerFileInput()">
              <i class="bx bx-upload"></i> Importar JSON
            </button>
            <input #fileInput type="file" accept=".json" (change)="importData($event)" hidden />
          </div>

          <!-- Mode Selection and Run -->
          <div class="form-section">
            <mat-form-field appearance="outline">
              <mat-label>Modo</mat-label>
              <mat-select [(ngModel)]="mode">
                <mat-option value="min">Minimizar</mat-option>
                <mat-option value="max">Maximizar</mat-option>
              </mat-select>
            </mat-form-field>
            <button mat-raised-button color="primary" (click)="runKruskal()">
              <i class="bx bx-play"></i> Resolver Kruskal
            </button>
          </div>

          <!-- Clear Button -->
          <button mat-raised-button color="warn" (click)="clearData()">
            <i class="bx bx-trash"></i> Limpiar
          </button>

          <!-- Help Button -->
          <app-help-button [helpContent]="helpContent" />
        </mat-card-content>
      </mat-card>
    </mat-sidenav>

    <!-- Right Canvas (70%) -->
    <mat-sidenav-content class="canvas-content">
      <mat-card appearance="outlined" class="canvas-card">
        <mat-card-content>
          <canvas #graphCanvas width="600" height="600"></canvas>
        </mat-card-content>
      </mat-card>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
