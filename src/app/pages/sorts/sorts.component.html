<mat-card class="sort-card" appearance="outlined">
  <mat-card-header>
    <app-sort-config
      [selectedAlgorithm]="selectedAlgorithm"
      [arraySize]="arraySize"
      [minValue]="minValue"
      [maxValue]="maxValue"
      [hValue]="hValue"
      [sortOrder]="sortOrder"
      [inputMode]="inputMode"
      [manualInput]="manualInput"
      [isSorting]="isSorting"
      (selectedAlgorithmChange)="onAlgorithmChange($event)"
      (arraySizeChange)="onArraySizeChange($event)"
      (minValueChange)="onMinValueChange($event)"
      (maxValueChange)="onMaxValueChange($event)"
      (hValueChange)="onHValueChange($event)"
      (sortOrderChange)="onSortOrderChange($event)"
      (inputModeChange)="onInputModeChange($event)"
      (manualInputChange)="onManualInputChange($event)"
      (validationError)="onValidationError($event)"
    />
  </mat-card-header>

  <mat-card-content>
    <div #chartContainer class="chart-container"></div>
    <div class="execution-time-container">
      <mat-card-subtitle>
        Tiempo de ejecución: {{ executionTime.toFixed(2) }} ms
      </mat-card-subtitle>
    </div>
  </mat-card-content>

  <app-sort-controls
    [isSorting]="isSorting"
    [isArrayEmpty]="arrayData.length === 0"
    [isPaused]="isPaused"
    [speedMultiplier]="speedMultiplier"
    (generate)="generateArray()"
    (sort)="startSort()"
    (clear)="clearSort()"
    (importFile)="importFile($event)"
    (exportFile)="exportFile($event)"
    (speedChange)="onSpeedChange($event)"
  />
</mat-card>
<app-help-button [helpContent]="helpContent" />
